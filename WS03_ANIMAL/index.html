<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="main.css" />
    <title>Lempieläimeni</title>

    <script src="animal.js" defer></script>
  </head>
  <body>
    <h1 id="animalTitle">My favorite Animal</h1>
    <h2>Sammakko!</h2>

    <p>
      Hi! My name is Lidiia and I'm a student at Laurea University. Right now
      I'm learning HTML, CSS and JavaScript in Web-development course.
      <br /><br />
      My favorite animal is the frog.
    </p>
    <div>
      <img
        src="img/sammako.webp"
        alt="Sammakko istuu ruohikossa"
        class="img1"
      />
      <img src="img/frog.jpg" alt="Sammakko istuu" class="img2" />
    </div>
    <a href="https://fi.wikipedia.org/wiki/Sammakko" target="_blank">
      Lisää sammakoista
    </a>
    <p><button id="animalButton">Click for the Frog</button></p>

    <h2>Choose another animal</h2>
    
   
    <form id ="animalForm">
      <label for = "animalInput">Type an animal:</label>
      <input id="animalInput" type="text" placeholder="Type an animal">
      <button type="submit">Submit</button>
    </form>

     <p id="animalOutput"></p>

  
  </body>
</html>
